<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permintaan Maaf</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
            text-align: center;
            max-width: 400px;
            border: 1px solid #ffe4e6;
        }
        h2 {
            color: #e11d48;
            margin-bottom: 15px;
        }
        p {
            color: #4b5563;
            line-height: 1.6;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Maaf ya, Sayang... 🥺</h2>
        <p>Maaf ya sering ninggalin kamu buat belajar. Aku benar-benar menghargai kesabaran kamu. <i>I love you</i>, nanti kalau belajarku udah kelar, <b>full time</b> buat kamu!</p>
    </div>

</body>
</html>
